[theme]
base = "light"
primaryColor = "#0F766E"          # Teal 700 — matches Palette.accent (brand)
backgroundColor = "#FAFAF9"       # Stone 50 — matches Palette.slate_50
secondaryBackgroundColor = "#F5F5F4"  # Stone 100 — sidebar + cards
textColor = "#1C1917"             # Stone 900 — matches Palette.ink
font = "sans serif"               # Inter is loaded via CSS; this is the fallback

[server]
headless = true
maxUploadSize = 200
# enableCORS and enableXsrfProtection are intentionally left at their
# defaults — overriding them on Community Cloud can break the session.

[browser]
gatherUsageStats = false
